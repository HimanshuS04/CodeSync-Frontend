<div class="page-container">
  <div class="auth-wrapper">

    <div class="logo-section">
      <h1>⟨/⟩ CodeSync</h1>
      <p>Code Together. Build Faster.</p>
    </div>

    <mat-card class="auth-card">
      <mat-card-header>
        <mat-card-title>Welcome Back</mat-card-title>
        <mat-card-subtitle>
          Sign in to your account
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>

        <div class="google-btn-wrapper">
          <div id="google-btn"></div>
          <div class="google-loading" *ngIf="googleLoading">
            Signing in with Google...
          </div>
        </div>

        <div class="divider">or sign in with email</div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

          <mat-form-field appearance="outline"
                          class="full-width">
            <mat-label>Email</mat-label>
            <input matInput
                   formControlName="email"
                   type="email"
                   placeholder="you@example.com">
            <mat-error
              *ngIf="form.get('email')?.hasError('email')">
              Invalid email format
            </mat-error>
            <mat-error
              *ngIf="form.get('email')?.hasError('required')">
              Email is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline"
                          class="full-width">
            <mat-label>Password</mat-label>
            <input matInput
                   formControlName="password"
                   [type]="hidePassword ? 'password' : 'text'">
            <mat-error
              *ngIf="form.get('password')?.hasError('minlength')">
              Minimum 6 characters
            </mat-error>
            <mat-error
              *ngIf="form.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button mat-raised-button
                  class="btn-primary full-width submit-btn"
                  type="submit"
                  [disabled]="form.invalid || loading">
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>

        </form>

      </mat-card-content>

      <mat-card-actions>
        <p class="register-link">
          Don't have an account?
          <a routerLink="/auth/register">Create one</a>
        </p>
      </mat-card-actions>

    </mat-card>
  </div>
</div>
