<app-navbar></app-navbar>

<div class="page">
  <div class="container">

    <div class="loading" *ngIf="loading">
      <p>Loading project...</p>
    </div>

    <div *ngIf="!loading && project">

      <button mat-button
              class="back-btn"
              (click)="goBack()">
        ← Back to Projects
      </button>

      <div class="project-header">
        <div class="header-left">
          <h1>{{ project.name }}</h1>
          <p>{{ project.description || 'No description' }}</p>
        </div>

        <div class="header-actions">
          <span class="badge"
                [class.public]="project.visibility==='PUBLIC'"
                [class.private]="project.visibility==='PRIVATE'">
            {{ project.visibility }}
          </span>

          <button mat-stroked-button
                  [class.starred]="isStarred"
                  (click)="toggleStar()">
            {{ isStarred ? '★' : '☆' }}
            {{ project.starCount }}
          </button>

          <button mat-raised-button
                  class="btn-primary"
                  (click)="openEditor()">
            Open Editor
          </button>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <p class="label">Language</p>
          <p class="value">{{ project.language }}</p>
        </div>
        <div class="info-card">
          <p class="label">Stars</p>
          <p class="value">{{ project.starCount }}</p>
        </div>
        <div class="info-card">
          <p class="label">Forks</p>
          <p class="value">{{ project.forkCount }}</p>
        </div>
        <div class="info-card">
          <p class="label">Created</p>
          <p class="value">
            {{ project.createdAt | date:'mediumDate' }}
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
