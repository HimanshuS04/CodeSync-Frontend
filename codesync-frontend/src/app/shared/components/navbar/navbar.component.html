<mat-toolbar class="navbar">

  <!-- Logo -->
  <span class="logo" routerLink="/dashboard">
    <mat-icon class="logo-icon">code</mat-icon>
    <span class="logo-text">CodeSync</span>
  </span>

  <span class="spacer"></span>

  <!-- Nav Links -->
  <nav class="nav-links">
    <button mat-button routerLink="/dashboard">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </button>
    <button mat-button routerLink="/projects">
      <mat-icon>folder</mat-icon>
      Projects
    </button>
  </nav>

  <!-- User Menu -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <div class="avatar">
      {{ user?.username?.charAt(0)?.toUpperCase() }}
    </div>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="menu-header">
      <p class="menu-username">{{ user?.username }}</p>
      <p class="menu-email">{{ user?.email }}</p>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-menu>

</mat-toolbar>
